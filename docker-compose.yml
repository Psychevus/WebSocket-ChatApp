version: '3'
services:
  chatapp-django:
    image: modrix/chatapp-django-image:v1.0
    container_name: chatapp-django
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - .:/app
    depends_on:
      - chatapp-db
      - chatapp-redis
    environment:
      DJANGO_SETTINGS_MODULE: WebSocketChatApp.settings
      DEBUG: "True"
      METRICS_PORT: "8001"
    healthcheck:
      test: [ "CMD", "python", "manage.py", "check" ]
      interval: 30s
      timeout: 10s
      retries: 5
    command: ["sh", "-c", "python manage.py migrate && daphne -b 0.0.0.0 -p 8000 WebSocketChatApp.asgi:application"]

  chatapp-db:
    image: mysql:5.7
    container_name: chatapp-db
    environment:
      MYSQL_DATABASE: chatapp
      MYSQL_USER: chatapp
      MYSQL_PASSWORD: chatapppassword
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  chatapp-redis:
    image: redis:6.2
    container_name: chatapp-redis
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - chatapp-django

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  mysql_data:
  grafana_data:
