apiVersion: v1
kind: Pod
metadata:
  name: {{ include "chatapp.fullname" . }}-redis-ha-test
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: bitnami/redis:7.2
      command:
        - /bin/sh
        - -c
      args:
        - |
          set -e
          redis-cli -h {{ include "chatapp.fullname" . }}-redis-master set K test
          MASTER=$(redis-cli -h {{ include "chatapp.fullname" . }}-redis-master info replication | awk -F: '/master_host/ {print $2}')
          kubectl delete pod -l app.kubernetes.io/component=master -n $NAMESPACE --field-selector=status.phase=Running --grace-period=0 --force
          echo "Waiting for failover"
          for i in $(seq 1 30); do
            VAL=$(redis-cli -h {{ include "chatapp.fullname" . }}-redis-master get K || true)
            if [ "$VAL" = "test" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Failover test failed" && exit 1
