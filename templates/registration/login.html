{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container mx-auto p-8 max-w-md">
  <h1 class="text-xl mb-4">Login</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="button-golden mt-4">Sign in</button>
  </form>
</div>
{% endblock %}
