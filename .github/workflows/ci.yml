name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install bandit

      - name: Run tests
        run: |
          coverage run --rcfile=.coveragerc --source='.' manage.py test ChatApp.tests --settings=WebSocketChatApp.test_settings
          coverage xml -i

      - name: Bandit Scan
        run: bandit -r websocket_chatapp -lll -f json -o bandit.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: chatapp:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Image Scan
        id: trivy
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: chatapp:test
          format: json
          output: trivy-image.json
          ignore-unfixed: true
          exit-code: 0

      - name: Fail on CVSS > 7
        run: |
          if jq '.Results[].Vulnerabilities[] | select((.CVSS.nvd.V3Score // 0) > 7)' trivy-image.json | grep -q .; then
            echo 'Vulnerabilities with CVSS > 7 found'
            exit 1
          fi

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan secrets with gitleaks
        run: gitleaks detect --source . --no-git --report-format=json --report-path=gitleaks.json

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit.json
            trivy-image.json
            gitleaks.json
            coverage.xml
