name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install bandit
          pip install codecov

      - name: Run tests
        run: |
          pytest
          coverage xml

      - name: Generate OpenAPI schema
        run: |
          python manage.py spectacular --file docs/openapi.yaml
          git diff --exit-code docs/openapi.yaml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: coverage.xml

      - name: Bandit Scan
        run: bandit -r . -lll -f sarif -o bandit.sarif

      - name: Upload Bandit report
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: bandit.sarif

      - name: Build Docker image
        run: docker build -t chatapp:test .

      - name: Trivy Image Scan
        run: |
          trivy image --severity HIGH,CRITICAL --format json -o trivy.json chatapp:test || true
          if jq '.Results[].Vulnerabilities | length > 0' trivy.json | grep -q true; then exit 1; fi

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan secrets with gitleaks
        run: gitleaks detect --source . --no-git --report-format sarif --report-path gitleaks.sarif

      - name: Upload gitleaks report
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: gitleaks.sarif
